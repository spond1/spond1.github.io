<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title == 'Home' %}{{ site.title }} — Strategic finance, economic consulting, and impact{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="author" content="{{ site.author.name }}">
<meta name="theme-color" content="#f4f0e8">
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script>
  (function () {
    try {
      var stored = localStorage.getItem('sokret-theme');
      var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = stored || preferred;
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  }());
</script>
